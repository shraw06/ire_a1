[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "recsys-ir"
version = "0.1.0"
description = "Unified lexical & semantic retrieval pipeline for MIND and EB-NeRD news recommendation datasets"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20.0,<1.0",
    "pyarrow>=14.0,<18.0",
    "duckdb>=0.9.0,<1.1",
    "faiss-cpu>=1.7.4,<1.9",
    "sentence-transformers>=2.2,<4.0",
    "scikit-learn>=1.3,<1.6",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "tqdm>=4.65,<5.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "rank-bm25>=0.2.2,<0.3",   # reference implementation for test assertions only
    "ruff>=0.1,<1.0",
    "ipykernel>=6.25,<7.0",
    "jupyter>=1.0,<2.0",
    "matplotlib>=3.7,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
